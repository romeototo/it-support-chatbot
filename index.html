    <style>
      :root {
        --primary: #6366f1;
        --primary-glow: rgba(99, 102, 241, 0.5);
        --secondary: #a855f7;
        --accent: #22d3ee;
        --bg-dark: #05070a;
        --glass-bg: rgba(17, 25, 40, 0.75);
        --glass-border: rgba(255, 255, 255, 0.125);
        --text-main: #f8fafc;
        --text-dim: #94a3b8;

        /* Premium color scheme variables */
        --deep-navy:    #1E1B3A;
        --brand-purple: #7C6EE8;
        --soft-lilac:   #F0EEFF;
        --secure-green: #13B57A;
        --surface-bg:   #F5F4F9;
        --urgent-coral: #FF6B4A;
        --border-light: #E2E0EF;
        --text-dark:    #2D2B3D;
        --text-muted:   #9896B0;
      }

      /* ===================== LIGHT MODE ===================== */
      body.light {
        --glass-bg: rgba(226, 232, 240, 0.75);
        --glass-border: rgba(100, 116, 139, 0.22);
        --text-main: #0f172a;
        --text-dim: #334155;
        --primary: #4f46e5;
        --primary-glow: rgba(79, 70, 229, 0.4);
        --secondary: #7c3aed;
        --accent: #0ea5e9;
        background: linear-gradient(
          135deg,
          #dde4f0 0%,
          #e8edf7 40%,
          #d4dff0 100%
        ) !important;
      }
      /* Glow orbs lighter */
      body.light::before {
        background: #6366f1;
        opacity: 0.06;
      }
      body.light::after {
        background: #a855f7;
        opacity: 0.05;
      }

      /* Header */
      body.light header {
        background: rgba(255, 255, 255, 0.72);
        border-bottom: 1px solid rgba(99, 102, 241, 0.18);
      }
      body.light header h1 {
        color: #1e1b4b;
      }
      body.light header p {
        color: #475569;
      }

      /* Sidebar */
      body.light .sidebar {
        background: rgba(255, 255, 255, 0.65);
        border-color: rgba(99, 102, 241, 0.15);
      }
      body.light .stitle {
        color: #6366f1;
      }
      body.light .qbtn {
        color: #1e293b;
        background: rgba(255, 255, 255, 0.5);
        border-color: rgba(148, 163, 184, 0.25);
      }
      body.light .qbtn:hover {
        background: rgba(99, 102, 241, 0.12);
        border-color: rgba(99, 102, 241, 0.35);
        border-left-color: #4f46e5;
        color: #312e81;
        box-shadow: 0 2px 10px rgba(99, 102, 241, 0.15);
      }

      /* Chat area */
      body.light .chat-wrap {
        background: rgba(241, 245, 249, 0.8);
        border-color: rgba(99, 102, 241, 0.15);
        box-shadow: 0 10px 40px rgba(99, 102, 241, 0.15);
      }
      /* Bot bubble */
      body.light .bot .bub {
        background: rgba(255, 255, 255, 0.9);
        color: #1e293b;
        border: 1px solid rgba(99, 102, 241, 0.14);
        box-shadow: 0 2px 8px rgba(79, 70, 229, 0.07);
      }
      body.light .bot .bub strong {
        color: #312e81;
      }
      /* User bubble */
      body.light .user .bub {
        color: #fff;
      }

      /* Input area */
      body.light .input-wrap {
        background: rgba(226, 232, 240, 0.85);
        border-top: 1px solid rgba(99, 102, 241, 0.15);
      }
      body.light #inp {
        background: rgba(255, 255, 255, 0.9);
        color: #0f172a;
        border: 1px solid rgba(99, 102, 241, 0.25);
      }
      body.light #inp::placeholder {
        color: #94a3b8;
      }

      /* Stats bar */
      body.light .stats-bar {
        background: rgba(215, 224, 238, 0.7);
        border-top: 1px solid rgba(99, 102, 241, 0.1);
        color: #475569;
      }
      body.light .stat span {
        color: #312e81;
      }

      /* History panel */
      body.light .history-panel {
        background: rgba(255, 255, 255, 0.65);
        border-color: rgba(99, 102, 241, 0.15);
      }
      body.light .hp-title {
        color: #312e81;
        border-bottom-color: rgba(99, 102, 241, 0.15);
      }
      body.light .hp-item {
        background: rgba(238, 242, 255, 0.8);
        border: 1px solid rgba(99, 102, 241, 0.12);
      }
      body.light .hp-item:hover {
        background: rgba(224, 231, 255, 0.9);
      }
      body.light .hp-item .hq {
        color: #1e293b;
        font-weight: 600;
      }
      body.light .hp-item .hm {
        color: #475569;
      }

      /* Badges & labels */
      body.light .hbadge {
        background: rgba(79, 70, 229, 0.12);
        color: #312e81;
        border-color: rgba(79, 70, 229, 0.25);
      }
      body.light .gemini-badge {
        color: #4f46e5;
        border-color: rgba(79, 70, 229, 0.3);
        background: rgba(79, 70, 229, 0.1);
      }

      /* ---- Header buttons (override inline styles) ---- */
      body.light header button {
        background: rgba(255, 255, 255, 0.7) !important;
        border: 1px solid rgba(99, 102, 241, 0.3) !important;
        color: #312e81 !important;
      }
      body.light header button:hover {
        background: rgba(99, 102, 241, 0.15) !important;
        color: #1e1b4b !important;
      }
      /* hbadge (FAQ count) */
      body.light .hbadge {
        background: rgba(79, 70, 229, 0.12) !important;
        color: #312e81 !important;
        border-color: rgba(79, 70, 229, 0.28) !important;
        font-weight: 700;
      }

      /* Feedback & copy buttons */
      body.light .fb-btn {
        color: #475569;
        border-color: rgba(148, 163, 184, 0.4);
      }
      body.light .fb-btn:hover {
        background: rgba(99, 102, 241, 0.1);
        color: #312e81;
      }
      body.light .copy-btn {
        color: #6366f1;
      }
      body.light .ticket-tag {
        color: #7c3aed;
      }

      /* Expand button */
      body.light .expand-btn {
        color: #4f46e5;
      }

      /* Sys message */
      body.light div[style*="text-align:center"] {
        color: #64748b !important;
      }

      /* Scrollbar */
      body.light .messages::-webkit-scrollbar-thumb {
        background: rgba(99, 102, 241, 0.25);
      }
      body.light .sidebar::-webkit-scrollbar-thumb {
        background: rgba(99, 102, 241, 0.2);
      }

      /* Clear chat button in light mode */
      body.light .clear-btn {
        background: rgba(255, 255, 255, 0.55);
        border-color: rgba(99, 102, 241, 0.25);
        color: #475569;
      }
      body.light .clear-btn:hover {
        background: rgba(239, 68, 68, 0.1);
        border-color: rgba(239, 68, 68, 0.35);
        color: #b91c1c;
      }

      /* ---- Sidebar Search ---- */
      .sidebar-search {
        margin-bottom: 15px;
      }
      .sidebar-search input {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        color: #e2e8f0;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 0.8rem;
        outline: none;
        transition: 0.3s;
        font-family: "Outfit", sans-serif;
      }
      .sidebar-search input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 10px var(--primary-glow);
      }
      .sidebar-search input::placeholder {
        color: var(--text-dim);
      }
      body.light .sidebar-search input {
        background: rgba(255, 255, 255, 0.7);
        border-color: rgba(99, 102, 241, 0.25);
        color: #0f172a;
      }

      /* ---- Quick Reply Chips ---- */
      .quick-chips-wrap {
        padding-left: 52px;
        margin-top: 4px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .chip-btn {
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.3);
        color: #a5b4fc;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 0.75rem;
        cursor: pointer;
        transition: 0.2s;
        font-family: "Outfit", sans-serif;
      }
      .chip-btn:hover {
        background: rgba(99, 102, 241, 0.3);
        color: #fff;
        transform: translateY(-1px);
      }
      body.light .chip-btn {
        background: rgba(99, 102, 241, 0.08);
        color: #4f46e5;
        border-color: rgba(99, 102, 241, 0.25);
      }
      body.light .chip-btn:hover {
        background: rgba(99, 102, 241, 0.18);
        color: #312e81;
      }

      /* ---- Gemini AI Config panel ---- */
      body.light .api-config {
        background: rgba(238, 242, 255, 0.92) !important;
        border-bottom: 1px solid rgba(99, 102, 241, 0.2) !important;
      }
      body.light .api-config label {
        color: #312e81 !important;
        font-weight: 600;
      }
      body.light .api-config input {
        background: rgba(255, 255, 255, 0.95) !important;
        border: 1px solid rgba(99, 102, 241, 0.3) !important;
        color: #0f172a !important;
      }
      body.light .api-config input::placeholder {
        color: #94a3b8 !important;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Timestamp under messages */
      .msg-time {
        font-size: 0.6rem;
        color: var(--text-dim);
        opacity: 0.6;
        margin-top: 4px;
        padding-left: 4px;
      }
      .user .msg-time { text-align: right; padding-right: 4px; }

      /* Dashboard link responsive */
      @media (max-width: 600px) {
        .dashboard-link-header { display: none !important; }
      }

      body {
        font-family: "Outfit", sans-serif;
        background: radial-gradient(
          circle at top right,
          #1e1b4b,
          #05070a,
          #0c0a09
        );
        color: var(--text-main);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      body::before,
      body::after {
        content: "";
        position: absolute;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: var(--primary);
        filter: blur(150px);
        opacity: 0.15;
        z-index: -1;
      }
      body::before {
        top: -100px;
        right: -100px;
      }
      body::after {
        bottom: -100px;
        left: -100px;
        background: var(--secondary);
      }

      header {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--glass-border);
        padding: 16px 30px;
        display: flex;
        align-items: center;
        gap: 16px;
        z-index: 100;
      }

      .logo-container {
        position: relative;
        width: 45px;
        height: 45px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        box-shadow: 0 0 20px var(--primary-glow);
      }

      .hinfo {
        flex: 1;
      }
      .hinfo h1 {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(to right, #fff, var(--text-dim));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .hinfo p {
        font-size: 0.75rem;
        color: var(--text-dim);
        margin-top: 2px;
      }

      .hbadge {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        color: var(--accent);
        padding: 4px 14px;
        border-radius: 100px;
        font-size: 0.7rem;
        font-weight: 600;
      }

      .gemini-badge {
        background: linear-gradient(
          135deg,
          rgba(124, 58, 237, 0.2),
          rgba(99, 102, 241, 0.2)
        );
        border: 1px solid rgba(124, 58, 237, 0.4);
        color: #c084fc;
        padding: 4px 14px;
        border-radius: 100px;
        font-size: 0.7rem;
        font-weight: 600;
        margin-left: 10px;
        box-shadow: 0 0 10px rgba(124, 58, 237, 0.2);
      }

      .api-config {
        background: rgba(0, 0, 0, 0.4);
        padding: 0 30px;
        display: flex;
        gap: 12px;
        align-items: center;
        border-bottom: 1px solid var(--glass-border);
        overflow: hidden;
        max-height: 0;
        transition:
          max-height 0.35s ease,
          padding 0.35s ease;
      }
      .api-config.open {
        max-height: 60px;
        padding: 10px 30px;
      }
      .api-config label {
        font-size: 0.75rem;
        color: var(--text-dim);
      }
      .api-config input {
        flex: 1;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        color: #fff;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 0.8rem;
        outline: none;
        transition: 0.3s;
      }
      .api-config input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 10px var(--primary-glow);
      }
      .api-config button {
        background: var(--primary);
        color: #fff;
        border: none;
        padding: 8px 20px;
        border-radius: 8px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
      }
      .api-config button:hover {
        transform: translateY(-1px);
        box-shadow: 0 5px 15px var(--primary-glow);
      }

      .main {
        display: flex;
        flex: 1;
        overflow: hidden;
        padding: 20px;
        gap: 20px;
      }

      .sidebar {
        width: 210px;
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        padding: 14px 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow-y: auto;
      }
      .sidebar::-webkit-scrollbar {
        width: 4px;
      }
      .sidebar::-webkit-scrollbar-thumb {
        background: var(--glass-border);
        border-radius: 10px;
      }

      .stitle {
        font-size: 0.65rem;
        color: var(--text-dim);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 6px;
        padding: 0 8px;
      }
      .qbtn {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid transparent;
        border-left: 3px solid transparent;
        color: var(--text-dim);
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 0.82rem;
        font-family: "Outfit", sans-serif;
        font-weight: 500;
        text-align: left;
        transition: all 0.25s ease;
        display: flex;
        align-items: center;
        gap: 8px;
        line-height: 1.3;
        width: 100%;
      }
      .qbtn:hover {
        background: rgba(99, 102, 241, 0.12);
        border-color: rgba(99, 102, 241, 0.25);
        border-left-color: var(--primary);
        color: #fff;
        transform: translateX(4px);
        box-shadow: 0 2px 12px rgba(99, 102, 241, 0.15);
      }
      .qbtn:active {
        transform: translateX(2px) scale(0.98);
      }

      .chat-wrap {
        flex: 1;
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 25px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .messages::-webkit-scrollbar {
        width: 5px;
      }
      .messages::-webkit-scrollbar-thumb {
        background: var(--glass-border);
        border-radius: 10px;
      }

      .msg {
        display: flex;
        gap: 14px;
        max-width: 80%;
        animation: slideUp 0.4s ease-out;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .msg.user {
        align-self: flex-end;
        flex-direction: row-reverse;
      }

      .av {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }
      .bot .av {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
      }
      .user .av {
        background: linear-gradient(135deg, #10b981, #3b82f6);
      }

      .bub {
        padding: 14px 18px;
        border-radius: 18px;
        font-size: 0.95rem;
        line-height: 1.6;
        position: relative;
        word-break: break-word;
      }
      .bub strong {
        color: #a5b4fc;
        font-weight: 700;
      }
      .bub em {
        color: #93c5fd;
        font-style: italic;
      }
      .bot .bub {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        border-top-left-radius: 4px;
        color: #e2e8f0;
      }
      .user .bub {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        border-top-right-radius: 4px;
        color: #fff;
        box-shadow: 0 5px 20px rgba(99, 102, 241, 0.2);
      }

      .msg-footer {
        display: flex;
        gap: 8px;
        margin-top: 6px;
        padding-left: 52px;
        align-items: center;
      }
      .copy-btn {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--glass-border);
        color: var(--text-dim);
        padding: 4px 10px;
        border-radius: 100px;
        cursor: pointer;
        font-size: 0.68rem;
        transition: all 0.2s;
        margin-left: auto;
      }
      .copy-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      .fb-btn {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--glass-border);
        color: var(--text-dim);
        padding: 5px 14px;
        border-radius: 100px;
        cursor: pointer;
        font-size: 0.72rem;
        transition: all 0.25s ease;
        user-select: none;
      }
      .fb-btn:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        transform: scale(1.05);
      }
      .fb-btn:disabled {
        cursor: default;
        opacity: 0.7;
      }
      .fb-btn.active-good {
        background: rgba(22, 163, 74, 0.25);
        border-color: #16a34a;
        color: #4ade80;
        box-shadow: 0 0 10px rgba(22, 163, 74, 0.2);
      }
      .fb-btn.active-bad {
        background: rgba(220, 38, 38, 0.25);
        border-color: #dc2626;
        color: #f87171;
        box-shadow: 0 0 10px rgba(220, 38, 38, 0.2);
      }

      .ticket-tag {
        font-size: 0.7rem;
        color: var(--text-dim);
        margin-left: 10px;
        align-self: center;
      }

      .input-wrap {
        padding: 20px 25px;
        background: rgba(0, 0, 0, 0.2);
        border-top: 1px solid var(--glass-border);
        display: flex;
        gap: 15px;
        align-items: center;
      }
      .input-container {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
      }
      .input-container input {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        color: #fff;
        padding: 15px 20px;
        border-radius: 16px;
        font-size: 1rem;
        outline: none;
        transition: 0.3s;
        font-family: "Inter", sans-serif;
      }
      .input-container input:focus {
        border-color: var(--primary);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
      }
      .input-container input:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        background: rgba(0, 0, 0, 0.2);
      }

      .send-btn {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        border: none;
        color: #fff;
        width: 50px;
        height: 50px;
        border-radius: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        transition: 0.3s;
        box-shadow: 0 5px 15px var(--primary-glow);
        opacity: 0.5;
        pointer-events: none;
      }
      .send-btn.active {
        opacity: 1;
        pointer-events: auto;
        animation: pulse-glow 2s infinite;
      }
      @keyframes pulse-glow {
        0% {
          box-shadow: 0 5px 15px var(--primary-glow);
        }
        50% {
          box-shadow: 0 5px 25px var(--primary);
        }
        100% {
          box-shadow: 0 5px 15px var(--primary-glow);
        }
      }
      .send-btn:hover {
        transform: scale(1.05) rotate(-10deg);
        box-shadow: 0 8px 25px var(--primary-glow);
        animation: none;
      }

      .stats-bar {
        padding: 10px 25px;
        display: flex;
        gap: 20px;
        font-size: 0.75rem;
        color: var(--text-dim);
        background: rgba(0, 0, 0, 0.1);
      }
      .stat span {
        color: var(--accent);
        font-weight: 700;
        margin-left: 3px;
      }

      .history-panel {
        width: 300px;
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .hp-title {
        padding: 18px 20px;
        font-size: 0.85rem;
        font-weight: 700;
        border-bottom: 1px solid var(--glass-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .hp-list {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
      }
      .hp-item {
        background: rgba(255, 255, 255, 0.03);
        border-radius: 14px;
        padding: 12px;
        margin-bottom: 12px;
        border: 1px solid transparent;
        transition: 0.3s;
        cursor: pointer;
      }
      .hp-item:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: var(--glass-border);
      }
      .hp-item .hn {
        font-size: 0.7rem;
        color: var(--accent);
        margin-bottom: 5px;
        font-weight: 600;
      }
      .hp-item .hq {
        font-size: 0.85rem;
        color: #f1f5f9;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hp-item .hr {
        font-size: 0.7rem;
        color: var(--text-dim);
        margin-top: 5px;
      }

      .typing-dots span {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: var(--text-dim);
        border-radius: 50%;
        margin: 0 2px;
        animation: dot 1.4s infinite;
      }
      .typing-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes dot {
        0%,
        80%,
        100% {
          transform: scale(1);
          opacity: 0.3;
        }
        40% {
          transform: scale(1.4);
          opacity: 1;
        }
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes typeCursor {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;

      /* Scroll to bottom button */
      .scroll-btn {

        height: 36px;

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;

      function sanitizeHTML(html) {
        const temp = document.createElement('div');
        temp.innerHTML = html;
        const dangerous = temp.querySelectorAll('script,iframe,object,embed,form,input,link,meta');
        dangerous.forEach(el => el.remove());
        temp.querySelectorAll('*').forEach(el => {
          for (const attr of [...el.attributes]) {
            if (attr.name.startsWith('on') || (attr.name === 'href' && attr.value.startsWith('javascript:'))) {
              el.removeAttribute(attr.name);
            }
          }
        });
        return temp.innerHTML;
      }

      // Sørensen-Dice bigram similarity helper for fuzzy matching
      function getBigrams(str) {
        const bigrams = new Set();
        for (let i = 0; i < str.length - 1; i++) {
          bigrams.add(str.slice(i, i + 2));
        }
        return bigrams;
      }

      function getSimilarity(s1, s2) {
        s1 = s1.toLowerCase().replace(/[^a-z0-9ก-๙]/g, "");
        s2 = s2.toLowerCase().replace(/[^a-z0-9ก-๙]/g, "");
        if (s1 === s2) return 1.0;
        if (s1.length < 2 || s2.length < 2) return s1.includes(s2) || s2.includes(s1) ? 0.5 : 0.0;
        
        const b1 = getBigrams(s1);
        const b2 = getBigrams(s2);
        let intersection = 0;
        for (const val of b1) {
          if (b2.has(val)) intersection++;
        }
        return (2.0 * intersection) / (b1.size + b2.size);
      }

      function scoreKB(input) {
        const query = input.trim().toLowerCase();
        if (!query) return null;

        const queryWords = query.split(/[\s,.\-?\/]+/).filter(w => w.length > 1);
        const results = [];

        for (const cat of window.KB.categories) {
          // Category keyword matching (exact + fuzzy)
          let kwBoost = 0;
          for (const kw of cat.keywords) {
            const lkw = kw.toLowerCase();
            if (query.includes(lkw)) {
              kwBoost += 3.0;
            } else {
              const sim = getSimilarity(query, lkw);
              if (sim > 0.6) {
                kwBoost += sim * 2.0;
              }
            }
          }

          for (const faq of cat.faqs) {
            let score = kwBoost;
            const faqQ = faq.question.toLowerCase();
            const faqWords = faqQ.split(/[\s,.\-?\/]+/).filter(w => w.length > 1);

            // 1. Word level matching (exact + fuzzy matching of words)
            for (const qw of queryWords) {
              if (faqQ.includes(qw)) {
                score += 1.5;
              } else {
                let maxWordSim = 0;
                for (const fw of faqWords) {
                  const sim = getSimilarity(qw, fw);
                  if (sim > maxWordSim) maxWordSim = sim;
                }
                if (maxWordSim > 0.65) {
                  score += maxWordSim * 1.0;
                }
              }
            }

            // 2. Full question similarity boost
            const fullSim = getSimilarity(query, faqQ);
            if (fullSim > 0.4) {
              score += fullSim * 4.0;
            }

            if (score >= 1.5) {
              results.push({
                faq,
                cat: cat.name,
                score: score
              });
            }
          }
        }

        results.sort((a, b) => b.score - a.score);

        if (results.length === 0) return null;

        const best = results[0];
        
        // Collect related questions (score >= 1.2, unique, not best)
        const related = [];
        const seenQuestions = new Set([best.faq.question]);
        for (let i = 1; i < results.length && related.length < 3; i++) {
          const item = results[i];
          if (!seenQuestions.has(item.faq.question) && item.score >= 1.2) {
            related.push(item.faq.question);
            seenQuestions.add(item.faq.question);
          }
        }

        return {
          faq: best.faq,
          cat: best.cat,
          score: best.score,
          related: related
        };
      }

      async function callGemini(userInput) {
        const top3 = [];
        const u = userInput.toLowerCase();
        for (const cat of window.KB.categories) {
          for (const faq of cat.faqs) {
            let s = 0;
            for (const kw of cat.keywords)
              if (u.includes(kw.toLowerCase())) s += 3;
            if (s > 0) top3.push(faq);
            if (top3.length >= 3) break;
          }
          if (top3.length >= 3) break;
        }
        const ctx = top3
          .map((f) => `Q: ${f.question}\nA: ${f.answer}`)
          .join("\n\n");

        const langPrompt =
          currentLang === "en"
            ? "STRICTLY respond in English. Do not use Thai in the answer."
            : "ตอบเป็นภาษาไทย สั้น ชัดเจน เป็นกันเอง และสุภาพ";

        const prompt = `You are a Corporate IT Support AI. ${langPrompt} Use numbered lists for steps.
If no info is found, say: Please contact IT Support ext.1234

Context (This is from our Thai KB, please translate the relevant parts to English for your response):
${ctx}

User Question: ${userInput}

Answer:`;

        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-goog-api-key": geminiKey },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
          },
        );
        if (!res.ok) {
          const errBody = await res.text().catch(() => "");
          if (res.status === 400) throw new Error("API Key ไม่ถูกต้อง — กรุณาตรวจสอบ Gemini API Key อีกครั้ง");
          if (res.status === 429) throw new Error("เรียก API บ่อยเกินไป — กรุณารอสักครู่แล้วลองใหม่");
          if (res.status === 403) throw new Error("API Key ไม่มีสิทธิ์ใช้งาน — ตรวจสอบว่าเปิดใช้ Gemini API แล้ว");
          throw new Error("API Error " + res.status + (errBody ? ": " + errBody.slice(0, 100) : ""));
        }
        const d = await res.json();
        return d.candidates[0].content.parts[0].text;
      }

      function formatMarkdown(text) {
        let html = text.replace(/</g, "&lt;");
        // Code Blocks
        html = html.replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>");
        // Inline Code
        html = html.replace(
          /`([^`]+)`/g,
          '<code style="background:rgba(0,0,0,0.2);padding:2px 4px;border-radius:4px;color:#a78bfa;">$1</code>',
        );
        // Bold
        html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        // Italic
        html = html.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
        // Internal related-question links can contain parentheses in the label.
        html = html.replace(
          /\[([^\]]+)\]\(ask:([^)]+)\)/g,
          '<a href="ask:$2" target="_blank" style="color:var(--accent);text-decoration:underline;">$1</a>',
        );
        // Links
        html = html.replace(
          /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
          '<a href="$2" target="_blank" style="color:var(--accent);text-decoration:underline;">$1</a>',
        );

        // Handle newlines and lists
        let lines = html.split("\n");
        let inUl = false,
          inOl = false;
        let parsed = [];

        for (let i = 0; i < lines.length; i++) {
          let line = lines[i];
          let ulMatch = line.match(/^[-*]\s+(.*)/);
          let olMatch = line.match(/^\d+\.\s+(.*)/);

          if (ulMatch) {
            if (inOl) {
              parsed.push("</ol>");
              inOl = false;
            }
            if (!inUl) {
              parsed.push(
                '<ul style="margin-top:5px; margin-bottom:5px; padding-left:20px;">',
              );
              inUl = true;
            }
            parsed.push(`<li>${ulMatch[1]}</li>`);
          } else if (olMatch) {
            if (inUl) {
              parsed.push("</ul>");
              inUl = false;
            }
            if (!inOl) {
              parsed.push(
                '<ol style="margin-top:5px; margin-bottom:5px; padding-left:20px;">',
              );
              inOl = true;
            }
            parsed.push(`<li>${olMatch[1]}</li>`);
          } else {
            if (inUl) {
              parsed.push("</ul>");
              inUl = false;
            }
            if (inOl) {
              parsed.push("</ol>");
              inOl = false;
            }
            parsed.push(line);
          }
        }
        if (inUl) parsed.push("</ul>");
        if (inOl) parsed.push("</ol>");

        html = parsed.join("<br>");
        // Clean up <br> around lists and inside pre
        html = html
          .replace(/<\/ul><br>/g, "</ul>")
          .replace(/<\/ol><br>/g, "</ol>")
          .replace(/<ul><br>/g, "<ul>")
          .replace(/<ol><br>/g, "<ol>");
        html = html.replace(
          /<pre><code>([\s\S]*?)<\/code><\/pre>/g,
          (m, c) =>
            `<pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:8px;overflow-x:auto;margin:5px 0;"><code>${c.replace(/<br>/g, "\n")}</code></pre>`,
        );

        return html;
      }

      function formatFaqAnswer(answer) {
        const raw = String(answer || "")
          .replace(/\r\n/g, "\n")
          .replace(/(\S)(\d+\.)/g, "$1\n$2 ")
          .replace(/(^|\n)(\d+\.)(?=\S)/g, "$1$2 ");

        if (/\n\s*\d+\.\s+/.test(raw)) return raw;

        const normalized = raw
          .replace(/([.!?])([A-Z][a-z])/g, "$1\n$2")
          .replace(/(ไหม|ครับ|ค่ะ|แล้ว)(Restart|Reset|Update|Login|Sign in|Check)/g, "$1\n$2")
          .replace(/(ก่อน|Client|Location|Password|ชั่วคราว|แล้ว|ได้ไหม\))(?=(Restart|เปลี่ยน|ตรวจ Username|ลองปิด|ติดต่อ IT|ติดต่อไอที|เปิด|ปิด|เช็ค|ตรวจสอบ))/g, "$1\n")
          .replace(/(?<!\n)(Restart VPN Client|เปลี่ยน Server Location|ตรวจ Username\/Password|ลองปิด Firewall\/Antivirus ชั่วคราว|ติดต่อ IT|ติดต่อไอที)/g, "\n$1")
          .split("\n")
          .map((line) => line.trim())
          .filter(Boolean);

        if (normalized.length <= 1) return answer;
        return normalized
          .map((line) => (/^([-*]|\d+\.)\s/.test(line) ? line : `- ${line}`))
          .join("\n");
      }

        document.getElementById("sBad").textContent = 0;
        localStorage.removeItem("itbot_stats");
        localStorage.removeItem("itbot_history");
        localStorage.removeItem("itbot_chat");
        document.getElementById("scrollBtn")?.classList.remove("visible");
        renderHistory();
        showWelcomeMessage(true);
      }

      // Typewriter animation for bot messages
      function typeWrite(el, html, speed = 12, onDone = null) {
        const tmp = document.createElement("div");
        tmp.innerHTML = html;
        const plainText = tmp.textContent || "";
        const fullHTML = html;
        let i = 0;
        el.classList.add("typing-cursor");
        const interval = setInterval(() => {
          i += 2; // 2 chars per tick for speed
          if (i >= plainText.length) {
            clearInterval(interval);
            el.classList.remove("typing-cursor");
            el.innerHTML = fullHTML;
            scrollToBottom();
            checkScrollBtn();
            disableInput(false);
            if (typeof onDone === "function") onDone();
          } else {
            // Show partial plain text during typing
            el.textContent = plainText.slice(0, i);
            scrollToBottom();
          }
        }, speed);
      }

      function addMsg(text, role, onTyped = null) {
        const w = document.getElementById("messages");
        const d = document.createElement("div");
        d.className = "msg " + role;
        const bub = document.createElement("div");
        bub.className = "bub";
        
        let avIcon = "👤";
        if (role === "bot") {
          avIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7C6EE8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>`;
        } else if (role === "admin") {
          avIcon = "👨‍💻";
        }
        
        // Timestamp - but only for non-bot (user/admin) messages, bot gets it in footer
        const ts = document.createElement("div");
        ts.className = "msg-time";
        ts.textContent = new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
        
        const wrapper = document.createElement("div");
        wrapper.style.flex = "1";
        wrapper.appendChild(bub);
        if (role !== "bot") {
          wrapper.appendChild(ts);
        }
        
        d.innerHTML = `<div class="av">${avIcon}</div>`;
        d.appendChild(wrapper);
        w.appendChild(d);
        if (role === "bot" || role === "admin") {
          typeWrite(bub, formatMarkdown(text), 12, () => {
            if (typeof onTyped === "function") onTyped();
            saveChatMessages();
          });
        } else {
          bub.innerHTML = formatMarkdown(text);
          scrollToBottom();
          saveChatMessages();
        }
        return d;
      }

      function addBotCopyButton(msgEl, tNum, text) {
        const bub = msgEl?.querySelector(".bub");
        if (!bub) return;
        bub.classList.add("has-copy");
        if (text) answerStore.set(tNum, text);
        const btn = document.createElement("button");
        btn.className = "bot-copy-btn";
        btn.type = "button";
        btn.id = "cpBubble" + tNum;
        btn.title = translations[currentLang].btnCopy;
        btn.setAttribute("aria-label", translations[currentLang].btnCopy);
        btn.textContent = "⧉";
        btn.addEventListener("click", () => copyAnswer(tNum));
        bub.appendChild(btn);
      }

      // Chat persistence functions
      function saveChatMessages() {
        const msgs = document.getElementById("messages");
        const items = msgs.querySelectorAll(".msg:not(#welcomeMsg)");
        const chatData = [];
        items.forEach(m => {
          const bub = m.querySelector(".bub");
          const time = m.querySelector(".msg-time");
          if (bub) {
            const cleanBub = bub.cloneNode(true);
            cleanBub.querySelectorAll(".bot-copy-btn").forEach((btn) => btn.remove());
            chatData.push({
              role: m.classList.contains("user") ? "user" : m.classList.contains("admin") ? "admin" : "bot",
              html: cleanBub.innerHTML,
              time: time ? time.textContent : ""
            });
          }
        });
        localStorage.setItem("itbot_chat", JSON.stringify(chatData.slice(-50)));
      }

      function restoreChat() {
        const saved = localStorage.getItem("itbot_chat");
        if (!saved) return;
        try {
          const chatData = JSON.parse(saved);
          const w = document.getElementById("messages");
          chatData.forEach((msg, index) => {
            const d = document.createElement("div");
            d.className = "msg " + msg.role;
            let avIcon = "👤";
            if (msg.role === "bot") {
              avIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7C6EE8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
              </svg>`;
            } else if (msg.role === "admin") {
              avIcon = "👨‍💻";
            }
            const bub = document.createElement("div");
            bub.className = "bub";
            bub.innerHTML = sanitizeHTML(msg.html);
            const ts = document.createElement("div");
            ts.className = "msg-time";
            ts.textContent = msg.time;
            const wrapper = document.createElement("div");
            wrapper.style.flex = "1";
            wrapper.appendChild(bub);
            if (msg.role !== "bot") {
              wrapper.appendChild(ts);
            }
            d.innerHTML = `<div class="av">${avIcon}</div>`;
            d.appendChild(wrapper);
            w.appendChild(d);
            if (msg.role === "bot") {
              addBotCopyButton(d, "restored" + Date.now() + index, bub.textContent || "");
            }
          });
          scrollToBottom();
        } catch(e) { console.error("Restore chat error:", e); }
      }

      function addFeedback(tNum, botText, score = null, category = null) {
        const w = document.getElementById("messages");
        const d = document.createElement("div");
        d.className = "msg-footer";

        const timeStr = new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
        
        let scoreBadge = "";
        if (score !== null) {
          const pct = Math.round(Math.min(Math.max((score / 5.0) * 100, 30), 100));
          scoreBadge = `<span class="score-badge">🎯 ${pct}% match</span>`;
        }
        
        let catBadge = "";
        if (category) {
          catBadge = `<span class="category-badge">${category}</span>`;
        }

        d.innerHTML = `
          <span class="msg-footer-time">${timeStr}</span>
          ${scoreBadge}
          ${catBadge}
          <div class="feedback-group">
            <button class="fb-btn" id="g${tNum}" onclick="feedback('${tNum}',1)">👍</button>
            <button class="fb-btn" id="b${tNum}" onclick="feedback('${tNum}',-1)">👎</button>
          </div>
          <span class="ticket-tag">#${tNum}</span>
          <button class="copy-btn" onclick="copyAnswer('${tNum}')" id="cp${tNum}">${translations[currentLang].btnCopy}</button>
        `;

        const chips = document.createElement("div");
        chips.className = "quick-chips-wrap";
        chips.innerHTML = `
          <button class="chip-btn" onclick="ask('${translations[currentLang].chipSolved}', this)">${translations[currentLang].chipSolved}</button>
          <button class="chip-btn" onclick="ask('${translations[currentLang].chipNotSolved}', this)">${translations[currentLang].chipNotSolved}</button>
          <button class="chip-btn" onclick="ask('${translations[currentLang].chipContact}', this)">${translations[currentLang].chipContact}</button>
        `;

        // store text for copy
        if (botText) answerStore.set(tNum, botText);
        w.appendChild(d);
        w.appendChild(chips);
        scrollToBottom();
      }

      function copyAnswer(tNum) {
        const text = answerStore.get(tNum) || "";
        navigator.clipboard.writeText(text).then(() => {
          const footerBtn = document.getElementById("cp" + tNum);
          const bubbleBtn = document.getElementById("cpBubble" + tNum);
          if (footerBtn) footerBtn.textContent = translations[currentLang].btnCopied;
          if (bubbleBtn) bubbleBtn.textContent = "✓";
          [footerBtn, bubbleBtn].forEach((btn) => {
            if (btn) btn.style.color = "#13B57A";
          });
          setTimeout(() => {
            if (footerBtn) footerBtn.textContent = translations[currentLang].btnCopy;
            if (bubbleBtn) bubbleBtn.textContent = "⧉";
            [footerBtn, bubbleBtn].forEach((btn) => {
              if (btn) btn.style.color = "";
            });
          }, 1500);
        });
      }

      function toggleAIConfig() {
        const el = document.querySelector(".api-config");
        el.classList.toggle("open");
        if (el.classList.contains("open")) {
          setTimeout(() => document.getElementById("geminiKey").focus(), 350);
        }
      }

      function feedback(tNum, val) {
        const g = document.getElementById("g" + tNum),
          b = document.getElementById("b" + tNum);
        if (!g || !b || g.disabled) return; // prevent double click
        g.disabled = true;
        b.disabled = true;
        g.className = "fb-btn" + (val === 1 ? " active-good" : "");
        b.className = "fb-btn" + (val === -1 ? " active-bad" : "");
        // Micro-animation on active button
        const activeBtn = val === 1 ? g : b;
        activeBtn.style.transform = "scale(1.15)";
        setTimeout(() => (activeBtn.style.transform = "scale(1)"), 250);
        if (val === 1) {
          stats.good++;
          document.getElementById("sGood").textContent = stats.good;
        } else {
          stats.bad++;
          document.getElementById("sBad").textContent = stats.bad;
        }
        const h = history.find((x) => x.ticket == tNum);
        if (h) h.feedback = val > 0 ? "👍" : "👎";
        renderHistory();
        // Save to localStorage
        localStorage.setItem("itbot_stats", JSON.stringify(stats));
        localStorage.setItem(
          "itbot_history",
          JSON.stringify(history.slice(-20)),
        );
      }

      function filterCats() {
        const query = document.getElementById("catSearch").value.toLowerCase();
        const btns = document.querySelectorAll(".sidebar .qbtn");
        btns.forEach((btn) => {
          const text = (btn.textContent || btn.innerText).toLowerCase();
          if (text.includes(query)) {
            btn.style.display = "";
          } else {
            btn.style.display = "none";
          }
        });
      }

      function addTyping(role = "bot") {
        document.getElementById("typing")?.remove();
        const w = document.getElementById("messages");
        const d = document.createElement("div");
        d.className = "msg " + role;
        d.id = "typing";
        let icon = "🤖";
        if (role === "bot") {
          icon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7C6EE8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>`;
        } else if (role === "admin") {
          icon = "👨‍💻";
        }
        d.innerHTML = `<div class="av">${icon}</div><div class="bub"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
        w.appendChild(d);
        scrollToBottom();
      }

      async function showWelcomeMessage(force = false) {
        const welcome = document.getElementById("welcomeMsg");
        const bub = document.getElementById("welcomeBub");
        if (!welcome || !bub) return;
        if (!force && welcome.classList.contains("active")) return;
        welcome.classList.remove("active");
        bub.innerHTML = "";
        addTyping("bot");
        await new Promise((r) => setTimeout(r, 420));
        document.getElementById("typing")?.remove();
        welcome.classList.add("active");
        typeWrite(bub, formatMarkdown(translations[currentLang].welcomeMsg), 12, () => {
          disableInput(false);
          scrollToBottom();
        });
      }

      function renderHistory() {
        const el = document.getElementById("histList");
        if (!history.length) {
          el.innerHTML = `<div class="empty-tickets">${translations[currentLang].histEmpty}</div>`;
          return;
        }
        el.innerHTML = [...history]
          .reverse()
          .map(
            (h) =>
              `<div class="hp-item"><div class="hn">#${escapeHtml(String(h.ticket))} • ${escapeHtml(h.time)} ${escapeHtml(h.feedback || "")}</div><div class="hq">${escapeHtml(h.question)}</div><div class="hr">${escapeHtml(h.mode)}</div></div>`,
          )
          .join("");
      }

      function ask(q, btnEl) {
        if (btnEl) {
          btnEl.parentNode.style.opacity = "0.5";
          btnEl.parentNode.style.pointerEvents = "none";
        }
        const inp = document.getElementById("inp");
        inp.value = q;
        send();
      }

      async function send() {
        const inp = document.getElementById("inp");
        const text = inp.value.trim();
        if (!text) return;
        disableInput(true);
        inp.value = "";
        addMsg(text, "user");
        const tNum = ++ticketNum;
        stats.tickets++;
        document.getElementById("sTicket").textContent = stats.tickets;
        
        const startTime = Date.now();
        addTyping();
        const now = new Date().toLocaleTimeString("th-TH", {
          hour: "2-digit",
          minute: "2-digit",
        });
        let reply = "",
          mode = "Keyword";

        let matchScore = null;
        let matchCat = null;

        const lowerText = text.toLowerCase();
        const isClosing =
          lowerText.includes("ขอบคุณ") ||
          lowerText.includes("แก้ไขได้แล้ว") ||
          lowerText.includes("เรียบร้อย") ||
          lowerText.includes("โอเค") ||
          lowerText.includes("thanks") ||
          lowerText.includes("thank you") ||
          lowerText.includes("solved") ||
          lowerText.includes("it works") ||
          /\bok\b/.test(lowerText);

        if (isClosing) {
          reply = translations[currentLang].closingMsg;
          mode = "System";
        } else {
          try {
            if (
              window.location.protocol !== "file:" &&
              !window.location.hostname.includes("github.io")
            ) {
              try {
                const res = await fetch("/api/chat", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ message: text, session_id: sessionId }),
                });
                if (res.ok) {
                  const data = await res.json();
                  reply = data.response;
                  mode = data.engine || "RAG Server";
                }
              } catch (e) {
                console.log("Backend fallback", e);
              }
            }

            if (!reply && geminiKey) {
              mode = "Gemini AI";
              reply = await callGemini(text);
            }

            if (!reply) {
              const m = scoreKB(text);
              if (m) {
                matchScore = m.score;
                matchCat = m.cat;
                let baseReply = `📋 **${m.faq.question}**\n\n${formatFaqAnswer(m.faq.answer)}`;
                // If in English mode but Keyword result is Thai, try translating if API key exists
                if (currentLang === "en" && geminiKey) {
                  try {
                    const transPrompt = `Translate this IT Support FAQ to professional English:\n\n${baseReply}`;
                    const res = await fetch(
                      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent`,
                      {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "x-goog-api-key": geminiKey },
                        body: JSON.stringify({
                          contents: [{ parts: [{ text: transPrompt }] }],
                        }),
                      },
                    );
                    if (res.ok) {
                      const d = await res.json();
                      baseReply = d.candidates[0].content.parts[0].text;
                      mode = "Keyword (Translated)";
                    }
                  } catch (e) {
                    console.error("Translation error", e);
                  }
                } else if (currentLang === "en") {
                  // Disclaimer if no API key for translation
                  baseReply =
                    `*(Note: Knowledge Base is only in Thai for Keyword Mode)*\n\n` +
                    baseReply;
                }

                reply = baseReply;

                // Append related questions links after translation
                if (m.related && m.related.length > 0) {
                  const titleText = currentLang === "en" ? "📌 **Related Questions:**" : "📌 **คำถามที่เกี่ยวข้อง:**";
                  const relatedLinks = m.related.map(q => {
                    const cleanQ = q.replace(/\[/g, '(').replace(/\]/g, ')');
                    return `* [${cleanQ}](ask:${encodeAskHref(q)})`;
                  }).join('\n');
                  reply += `\n\n${titleText}\n${relatedLinks}`;
                }
              } else {
                reply = translations[currentLang].escalationMsg;
              }
              mode = "Keyword";
            }
          } catch (e) {
            reply = translations[currentLang].sysError + e.message;
            mode = "Error";
          }
        }

        if (!matchCat) {
          matchCat = detectCategory(text);
        }

        // Typing delay logic: at least 450ms
        const elapsedTime = Date.now() - startTime;
        const minDelay = 450;
        if (elapsedTime < minDelay) {
          await new Promise((r) => setTimeout(r, minDelay - elapsedTime));
        }

        document.getElementById("typing")?.remove();
        const botMsg = addMsg(reply, "bot", () => addBotCopyButton(botMsg, tNum, reply));
        addFeedback(tNum, reply, matchScore, matchCat);
        history.push({
          ticket: tNum,
          question: text,
          time: now,
          mode,
          feedback: "",
        });
        renderHistory();
        // Save to localStorage
        stats.tickets = parseInt(
          document.getElementById("sTicket").textContent,
        );
        localStorage.setItem("itbot_stats", JSON.stringify(stats));
        localStorage.setItem(
          "itbot_history",
          JSON.stringify(history.slice(-20)),
        );

        // Sync to HelpDesk Pro Dashboard via LocalStorage
        let hdTickets = JSON.parse(
          localStorage.getItem("helpdesk_tickets") || "[]",
        );

        let lastTicket =
          hdTickets.length > 0 ? hdTickets[hdTickets.length - 1] : null;
        let newStatus = isClosing ? "closed" : "open";
        // Determine category for API sync
        let category = detectCategory(text);

        if (
          lastTicket &&
          (lastTicket.status === "open" || lastTicket.status === "progress")
        ) {
          // Append to existing active ticket
          lastTicket.messages.push({ role: "user", text: text });
          lastTicket.messages.push({ role: "bot", text: reply });
          if (isClosing) lastTicket.status = "closed";
          else lastTicket.status = "open"; // Switch back to open if admin was progressing
        } else {
          // Create new ticket
          let priority =
            text.includes("ไม่") ||
            text.includes("ด่วน") ||
            text.includes("พัง") ||
            text.includes("ลืม")
              ? "critical"
              : "medium";
          let category = detectCategory(text);

          hdTickets.push({
            id: `INC-${tNum}`,
            time: now,
            title: text,
            priority: priority,
            status: newStatus,
            category: category,
            messages: [
              { role: "user", text: text },
              { role: "bot", text: reply },
            ],
          });
        }

        // Keep only latest 50 tickets
        if (hdTickets.length > 50) hdTickets = hdTickets.slice(-50);
        localStorage.setItem("helpdesk_tickets", JSON.stringify(hdTickets));

        // Also sync to backend API (non-blocking)
        if (!window.location.hostname.includes("github.io") && window.location.protocol !== "file:") {
          fetch("/api/tickets/new", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({
              user_name: "Web User",
              message: text,
              bot_response: reply,
              category: category
            })
          }).catch(() => {});
        }
      }

      // Listen for Admin replies and typing from Dashboard
      window.addEventListener("storage", (e) => {
        if (e.key === "helpdesk_tickets") {
          const oldData = JSON.parse(e.oldValue || "[]");
          const newData = JSON.parse(e.newValue || "[]");
          if (newData.length > 0 && oldData.length > 0) {
            const latestNew = newData[newData.length - 1];
            const latestOld = oldData[oldData.length - 1];
            if (
              latestNew.id === latestOld.id &&
              latestNew.messages.length > latestOld.messages.length
            ) {
              const newMsg = latestNew.messages[latestNew.messages.length - 1];
              if (newMsg.role === "admin") {
                document.getElementById("typing")?.remove();
                addMsg(newMsg.text, "admin");
                // Browser notification for admin reply
                if (Notification.permission === "granted" && document.hidden) {
                  new Notification("👨‍💻 IT Support ตอบกลับ", {
                    body: newMsg.text.slice(0, 100),
                    icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>"
                  });
                }
              }
            }
          }
        }

        if (e.key === "admin_typing") {
          const data = JSON.parse(e.newValue || "{}");
          if (data.typing) {
            addTyping("admin");
          } else {
            document.getElementById("typing")?.remove();
          }
        }
      });

      // Escape key to close AI Config panel
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          const apiConfig = document.querySelector(".api-config");
          if (apiConfig && apiConfig.classList.contains("open")) {
            apiConfig.classList.remove("open");
          }
        }
      });

      function initUI() {
        const maxTries = 20;
        let tries = 0;

        // Delegated click handler for related questions
        const messagesContainer = document.getElementById("messages");
        if (messagesContainer) {
          messagesContainer.addEventListener("click", (e) => {
            const link = e.target.closest("a");
            if (link) {
              const href = link.getAttribute("href") || "";
              if (href.startsWith("ask:")) {
                e.preventDefault();
                const q = decodeURIComponent(href.slice(4));
                ask(q);
              }
            }
          });
        }

        // Request notification permission
        if ("Notification" in window && Notification.permission === "default") {
          Notification.requestPermission();
        }

        // Register PWA Service Worker
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        }

        // Restore chat messages
        restoreChat();
        if (!localStorage.getItem("itbot_chat")) {
          showWelcomeMessage();
        }

        const checkKB = setInterval(() => {
          tries++;
          if (window.KB) {
            clearInterval(checkKB);
            console.log("KB loaded successfully after", tries, "tries");
            renderUI();
          } else if (tries >= maxTries) {
            clearInterval(checkKB);
            console.error("KB failed to load after maximum retries");
            const faqEl = document.getElementById("faqCount");
            if (faqEl) faqEl.textContent = "Error: No KB Found";
          }
        }, 100);

        if (window.innerWidth > 768) {
          document.getElementById("inp").focus();
        }
      }

      function renderUI() {
        try {
          const totalFaq = window.KB.categories.reduce(
            (sum, cat) => sum + cat.faqs.length,
            0,
          );
          const totalCat = window.KB.categories.length;

          const faqEl = document.getElementById("faqCount");
          if (faqEl) {
            faqEl.textContent =
              totalFaq +
              " FAQ | " +
              totalCat +
              (currentLang === "th" ? " หมวด" : " Cats");
          }

          const topCats = window.KB.categories
            .slice(0, 5)
            .map((c) => c.name)
            .join(", ");
          const wb = document.getElementById("welcomeBub");
          const welcome = document.getElementById("welcomeMsg");
          if (wb && welcome?.classList.contains("active")) {
            wb.innerHTML = formatMarkdown(translations[currentLang].welcomeMsg);
          }
        } catch (err) {
          console.error("Render UI error:", err);
        }
      }

      function toggleMoreChips() {
        const moreChips = document.getElementById("moreChips");
        const btn = document.getElementById("toggleChipsBtn");
        if (!moreChips || !btn) return;
        
        const isExpanded = moreChips.classList.toggle("expanded");
        const btnText = btn.querySelector(".btn-text") || btn;
        
        if (currentLang === "th") {
          btnText.textContent = isExpanded ? "ย่อ ▲" : "ดูทั้งหมด ▾";
        } else {
          btnText.textContent = isExpanded ? "Collapse ▲" : "View All ▾";
        }
      }

      // Start initialization
      initUI();
