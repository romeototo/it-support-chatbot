name: Python Tests

on:
  push:
    paths:
      - "**.py"
      - "**.html"
      - "**.js"
      - "knowledge_base.json"
      - "requirements*.txt"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "**.py"
      - "**.html"
      - "**.js"
      - "knowledge_base.json"
      - "requirements*.txt"
      - ".github/workflows/python-tests.yml"

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
